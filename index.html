<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Idaho Driver's License Practice Test</title>
<style>
:root {
  --bg: #0f172a;
  --card-bg: #1e293b;
  --border: #334155;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --success: #10b981;
  --danger: #ef4444;
  --accent: #e2e8f0;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding: 16px;
  display: flex;
  justify-content: center;
}
.container {
  width: 100%;
  max-width: 540px;
  margin: auto;
  padding-bottom: 40px;
}
header {
  text-align: center;
  margin-bottom: 20px;
}
header h1 {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text);
}
header p {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-top: 4px;
}
.progress-bar-container {
  width: 100%;
  background-color: var(--border);
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 16px;
}
.progress-bar {
  height: 100%;
  width: 0%;
  background-color: var(--primary);
  transition: width 0.3s ease;
}
.card {
  background-color: var(--card-bg);
  border-radius: 12px;
  padding: 20px;
  border: 1px solid var(--border);
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
}
.meta {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-bottom: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.q-img {
  display: none;
  justify-content: center;
  margin-bottom: 16px;
}
.q-img svg {
  height: 140px;
  width: auto;
  max-width: 100%;
  border-radius: 8px;
}
.question-text {
  font-size: 1.05rem;
  font-weight: 600;
  margin-bottom: 20px;
  color: var(--accent);
}
.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.option-btn {
  background-color: #273549;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 14px 16px;
  border-radius: 8px;
  font-size: 0.95rem;
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  transition: all 0.15s ease;
  touch-action: manipulation;
}
.option-btn:active {
  transform: scale(0.98);
}
.option-btn .label {
  background-color: var(--border);
  color: var(--text-muted);
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 0.75rem;
  flex-shrink: 0;
  font-weight: 700;
}
.option-btn.correct {
  background-color: rgba(16, 185, 129, 0.2);
  border-color: var(--success);
  color: #a7f3d0;
}
.option-btn.correct .label {
  background-color: var(--success);
  color: #fff;
}
.option-btn.wrong {
  background-color: rgba(239, 68, 68, 0.2);
  border-color: var(--danger);
  color: #fecaca;
}
.option-btn.wrong .label {
  background-color: var(--danger);
  color: #fff;
}
.feedback {
  margin-top: 20px;
  padding: 14px;
  border-radius: 8px;
  display: none;
  font-size: 0.9rem;
  line-height: 1.4;
}
.feedback.correct {
  background-color: rgba(16, 185, 129, 0.15);
  border: 1px solid var(--success);
  color: #6ee7b7;
}
.feedback.wrong {
  background-color: rgba(239, 68, 68, 0.15);
  border: 1px solid var(--danger);
  color: #fca5a5;
}
.feedback-title {
  font-weight: 700;
  margin-bottom: 4px;
}
.controls {
  margin-top: 20px;
  display: flex;
  justify-content: flex-end;
}
.btn {
  background-color: var(--primary);
  color: white;
  border: none;
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  display: none;
  touch-action: manipulation;
}
.btn:active {
  background-color: var(--primary-hover);
}
.results-screen {
  display: none;
  text-align: center;
}
.results-screen h2 {
  font-size: 1.5rem;
  margin-bottom: 8px;
}
.score-circle {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 4px solid var(--primary);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 24px auto;
}
.score-circle .pct {
  font-size: 1.6rem;
  font-weight: 700;
}
.score-circle .detail {
  font-size: 0.8rem;
  color: var(--text-muted);
}
.pass-tag {
  display: inline-block;
  padding: 6px 16px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 0.9rem;
  margin-bottom: 16px;
}
.pass-tag.pass {
  background-color: rgba(16, 185, 129, 0.2);
  color: var(--success);
  border: 1px solid var(--success);
}
.pass-tag.fail {
  background-color: rgba(239, 68, 68, 0.2);
  color: var(--danger);
  border: 1px solid var(--danger);
}
.restart-btn {
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  background-color: var(--primary);
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  font-size: 1rem;
  cursor: pointer;
}
.menu-screen { display: block; text-align: center; }
.menu-screen h2 { font-size: 1.1rem; margin-bottom: 4px; }
.menu-screen p.sub { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px; }
.mode-btn {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 16px;
  text-align: left;
  background-color: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
}
.mode-btn:hover { border-color: var(--primary); }
.mode-btn small { display: block; margin-top: 4px; font-weight: 400; font-size: 0.82rem; color: var(--text-muted); }
.restart-btn.secondary { background-color: transparent; border: 1px solid var(--border); color: var(--text); margin-top: 10px; }
.rating { font-size: 1.05rem; font-weight: 700; color: var(--accent); margin: 4px 0 8px; }
.site-footer {
  text-align: center;
  margin-top: 24px;
  font-size: 0.85rem;
}
.site-footer a {
  color: #6ee7b7;
  text-decoration: underline;
}
.site-footer a:hover {
  color: #a7f3d0;
}
</style>
<script data-goatcounter="https://0utrider.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<div class="container">
<header>
<h1>Idaho Knowledge Test Prep</h1>
<p>Randomized pool based on the Idaho Driver's Handbook</p>
</header>
<div class="card menu-screen" id="menuScreen">
<h2>Choose your quiz</h2>
<p class="sub">Both modes pull random questions from the Idaho Driver's Handbook.</p>
<button class="mode-btn" onclick="startQuiz('full')">Full Practice Test<small>20 random questions on everything: rules, signs, signals, and more</small></button>
<button class="mode-btn" onclick="startQuiz('signs')">Signs &amp; Signals<small>40 random questions on signs, barricades, signals, and pavement markings, with a rating at the end</small></button>
</div>
<div class="progress-bar-container" id="progressContainer">
<div class="progress-bar" id="progressBar"></div>
</div>
<div class="card" id="quizCard">
<div class="meta">
<span id="questionNum">Question 1</span>
<span id="currentScore">Score: 0/0</span>
</div>
<div class="q-img" id="questionImg"></div>
<div class="question-text" id="questionText">Loading question...</div>
<div class="options" id="optionsContainer"></div>
<div class="feedback" id="feedback">
<div class="feedback-title" id="feedbackTitle"></div>
<div id="feedbackText"></div>
</div>
<div class="controls">
<button class="btn" id="nextBtn" onclick="nextQuestion()">Next Question</button>
</div>
</div>
<div class="card results-screen" id="resultsScreen">
<h2>Exam Complete</h2>
<div id="statusBadge" class="pass-tag">PASS</div>
<div class="rating" id="ratingText"></div>
<div class="score-circle">
<div class="pct" id="scorePercent">0%</div>
<div class="detail" id="scoreFraction">0 / 0</div>
</div>
<p id="summaryMessage" style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 8px;"></p>
<button class="restart-btn" onclick="startQuiz(currentMode)">Try Again (same mode)</button>
<button class="restart-btn secondary" onclick="showMenu()">Main Menu</button>
</div>
<footer class="site-footer">
<a href="https://github.com/0utrider/IdahoDrivingTest" target="_blank" rel="noopener noreferrer">About this quiz</a>
</footer>
</div>
<script>
const QUESTION_BANK = [
{
  q: "When parallel parking next to a curb or edge of the roadway in Idaho, your vehicle must be within what distance of the curb?",
  options: ["6 inches", "12 inches", "18 inches", "24 inches"],
  correct: 2,
  tip: "Idaho law requires you to park parallel to and within 18 inches of the curb or edge of the roadway. (Handbook pg. 80)"
},
{
  q: "What is Idaho's 'Basic Rule' speed law?",
  options: [
    "Always drive the exact posted speed limit.",
    "Drive at a speed that is reasonable and prudent at all times.",
    "Never drive below 45 mph on any paved highway.",
    "Stay 5 mph slower than adjacent traffic."
  ],
  correct: 1,
  tip: "Idaho's Basic Rule requires drivers to drive at a speed that is reasonable and prudent for existing road, weather, and traffic conditions. (Handbook pg. 68)"
},
{
  q: "When turning or changing lanes, Idaho law requires you to continuously signal for at least how far in business or residential areas?",
  options: ["50 feet", "100 feet", "200 feet", "300 feet"],
  correct: 1,
  tip: "Signals must start at least 100 feet ahead in business/residential areas, or at least 5 seconds before on freeways. (Handbook pg. 72)"
},
{
  q: "How far in advance must you signal before changing lanes or exiting on a freeway?",
  options: ["3 seconds", "5 seconds", "100 feet", "10 seconds"],
  correct: 1,
  tip: "On freeways or highways, turn signals must be activated at least 5 seconds before changing lanes or exiting. (Handbook pg. 72, 85)"
},
{
  q: "You do NOT have to stop for a school bus with flashing red lights if:",
  options: [
    "You are traveling in a rural area.",
    "The bus is in a turn lane.",
    "You are traveling in the opposite direction on a highway with four or more lanes (two lanes in each direction).",
    "You are driving a commercial vehicle."
  ],
  correct: 2,
  tip: "You do not need to stop if traveling in the opposite direction on a highway with four or more lanes (at least two lanes each way). (Handbook pg. 70)"
},
{
  q: "When required to stop at a railroad grade crossing, a vehicle must stop within what distance from the nearest rail?",
  options: [
    "Within 25 feet but no less than 5 feet",
    "Within 50 feet but no less than 15 feet",
    "Within 75 feet but no less than 20 feet",
    "Within 100 feet but no less than 30 feet"
  ],
  correct: 1,
  tip: "When required to stop at a railroad crossing, stop within 50 feet but no less than 15 feet from the nearest rail. (Handbook pg. 60, 138)"
},
{
  q: "What is the minimum recommended following distance under ideal driving conditions in Idaho?",
  options: ["2 seconds", "3 seconds", "4 seconds", "5 seconds"],
  correct: 1,
  tip: "The three-second following distance rule is the minimum recommended safe procedure in Idaho. (Handbook pg. 79)"
},
{
  q: "When parking on a hill facing downhill with a curb, which way should you turn your front wheels?",
  options: [
    "Straight ahead",
    "Sharply away from the curb",
    "Sharply toward and against the curb",
    "Parallel to the centerline"
  ],
  correct: 2,
  tip: "When parking downhill with a curb, turn your front wheels sharply toward and against the curb. (Handbook pg. 81)"
},
{
  q: "When parking uphill on a street that HAS a curb, how should you turn your wheels?",
  options: [
    "Sharply away from the curb",
    "Sharply toward the curb",
    "Straight ahead",
    "Toward the shoulder"
  ],
  correct: 0,
  tip: "When parking uphill with a curb, turn your front wheels sharply away and against the curb. (Handbook pg. 81)"
},
{
  q: "In Idaho, parking is prohibited within how many feet of a fire hydrant?",
  options: ["10 feet", "15 feet", "20 feet", "30 feet"],
  correct: 1,
  tip: "Parking is prohibited within 15 feet of a fire hydrant. (Handbook pg. 81)"
},
{
  q: "Parking is prohibited within how many feet of a stop sign, yield sign, or traffic signal?",
  options: ["15 feet", "20 feet", "25 feet", "30 feet"],
  correct: 3,
  tip: "Parking is illegal within 30 feet of any stop sign, yield sign, or traffic signal. (Handbook pg. 81)"
},
{
  q: "Parking is prohibited within how many feet of a crosswalk?",
  options: ["15 feet", "20 feet", "30 feet", "50 feet"],
  correct: 1,
  tip: "Parking is illegal within 20 feet of a crosswalk at an intersection. (Handbook pg. 81)"
},
{
  q: "When passing another vehicle on a two-lane road, you must complete the pass before coming within how many feet of oncoming traffic?",
  options: ["100 feet", "150 feet", "200 feet", "400 feet"],
  correct: 2,
  tip: "You must complete the pass and return to your lane before coming within 200 feet of oncoming traffic. (Handbook pg. 78)"
},
{
  q: "Passing is strictly prohibited within how many feet of an intersection or railroad crossing?",
  options: ["50 feet", "100 feet", "150 feet", "200 feet"],
  correct: 1,
  tip: "Passing is prohibited within 100 feet of an intersection or railroad grade crossing. (Handbook pg. 76)"
},
{
  q: "On a two-lane highway with a posted limit of 55 mph or higher, how much may a passenger car exceed the speed limit when passing a slower vehicle?",
  options: [
    "You cannot exceed the speed limit at all",
    "Up to 5 mph",
    "Up to 10 mph",
    "Up to 15 mph"
  ],
  correct: 3,
  tip: "Idaho allows passenger vehicles/pickups (not towing) to exceed the speed limit by up to 15 mph to pass on 2-lane roads posted at 55 mph or more. (Handbook pg. 77)"
},
{
  q: "You must dim your high-beam headlights within _____ feet of meeting an oncoming vehicle and _____ feet of overtaking another vehicle.",
  options: [
    "500 feet; 200 feet",
    "350 feet; 100 feet",
    "1,000 feet; 500 feet",
    "500 feet; 300 feet"
  ],
  correct: 0,
  tip: "Headlamps must be dimmed 500 feet before meeting and 200 feet before overtaking another vehicle. (Handbook pg. 43)"
},
{
  q: "When are you required to turn on vehicle headlights in Idaho?",
  options: [
    "Only between 10:00 PM and 5:00 AM",
    "From sunset to sunrise, and whenever visibility is reduced to 500 feet or less",
    "Only when driving on interstates in darkness",
    "Whenever it is raining, regardless of visibility"
  ],
  correct: 1,
  tip: "Headlamps must be lighted from sunset to sunrise and anytime visibility is reduced to 500 feet or less. (Handbook pg. 43, 110)"
},
{
  q: "Under Idaho's GDL program, what is the night travel restriction for a driver under 16 years of age?",
  options: [
    "No driving after 9:00 PM under any circumstances.",
    "Daylight-only driving (5:00 AM to 10:00 PM) unless accompanied by a licensed driver 21 or older in the front seat.",
    "May drive anytime if driving to work or school.",
    "May drive after dark accompanied by any licensed sibling."
  ],
  correct: 1,
  tip: "Under 16, daylight-only travel (5:00 AM to 10:00 PM) is allowed unless accompanied by a licensed driver at least 21 in the front seat. (Handbook pg. 16)"
},
{
  q: "For the first 6 months of holding an Idaho driver's license, a driver under 17 is limited to:",
  options: [
    "Zero passengers",
    "No more than one passenger under 17 who is not related by blood, adoption, or marriage",
    "Up to three minor friends",
    "No passengers on freeways"
  ],
  correct: 1,
  tip: "For the first 6 months, drivers under 17 may carry no more than 1 non-relative passenger under 17. (Handbook pg. 16)"
},
{
  q: "In Idaho, an adult driver (21 or older) is legally considered driving under the influence at what Blood Alcohol Concentration (BAC)?",
  options: [".02 BAC", ".04 BAC", ".08 BAC", ".10 BAC"],
  correct: 2,
  tip: "For drivers 21 or older, DUI is .08 BAC or higher. Under 21 is .02, and CDL drivers is .04. (Handbook pg. 132)"
},
{
  q: "What is the legal Blood Alcohol Concentration (BAC) limit for drivers under 21 years of age in Idaho?",
  options: [".00 BAC", ".02 BAC", ".05 BAC", ".08 BAC"],
  correct: 1,
  tip: "Idaho has a strict .02 BAC limit for any driver under the age of 21. (Handbook pg. 132)"
},
{
  q: "When approaching an emergency vehicle or tow truck stopped with flashing lights on a multi-lane road, what does Idaho law require?",
  options: [
    "Maintain speed and sound horn",
    "Reduce speed below the speed limit and change lanes into a non-adjacent lane if safe",
    "Stop completely in your lane until passed",
    "Turn on hazard flashers and accelerate past"
  ],
  correct: 1,
  tip: "Under the Move Over law, reduce speed below the limit and move over into a lane not adjacent to the vehicle if safe to do so. (Handbook pg. 95)"
},
{
  q: "In Idaho, studded snow tires are legally permitted between what dates?",
  options: [
    "September 1 to April 1",
    "November 15 to March 15",
    "October 1 to April 30",
    "December 1 to March 31"
  ],
  correct: 2,
  tip: "Studded snow tires are allowed only from October 1 to April 30 (unless adjusted by ITD for weather). (Handbook pg. 42, 114)"
},
{
  q: "What minimum tire tread depth is required by Idaho law?",
  options: ["1/32 of an inch", "2/32 of an inch", "4/32 of an inch", "3/16 of an inch"],
  correct: 1,
  tip: "Tires must have at least 2/32 of an inch of tread. (Handbook pg. 36, 39)"
},
{
  q: "What is the maximum speed limit in any residential, business, or urban district in Idaho unless otherwise posted?",
  options: ["20 mph", "25 mph", "30 mph", "35 mph"],
  correct: 3,
  tip: "The maximum speed in any residential, business, or urban district is 35 mph unless otherwise posted. (Handbook pg. 68)"
},
{
  q: "At an uncontrolled intersection where two vehicles arrive at the same time, who yields?",
  options: [
    "The larger vehicle yields to the smaller one.",
    "The vehicle on the left yields to the vehicle on the right.",
    "The vehicle on the right yields to the vehicle on the left.",
    "The vehicle traveling faster goes first."
  ],
  correct: 1,
  tip: "If two vehicles arrive simultaneously at an uncontrolled intersection, the vehicle on the left must yield to the vehicle on the right. (Handbook pg. 75)"
},
{
  q: "If a traffic signal loses power and goes completely dark, how should you treat the intersection?",
  options: [
    "Treat it as an uncontrolled yielding zone",
    "Yield only to traffic from the right",
    "Treat it as a four-way stop",
    "The busiest road has continuous right-of-way"
  ],
  correct: 2,
  tip: "Whenever a traffic signal is dark or non-functioning, treat the intersection as a four-way stop. (Handbook pg. 56, 76, 136)"
},
{
  q: "When must a slow-moving vehicle on a two-lane road turn off into a turnout to allow others to pass?",
  options: [
    "When driving 10 mph under the speed limit",
    "When delaying 3 or more vehicles behind it in a rural area",
    "Whenever any car appears behind it",
    "Only when directed by law enforcement"
  ],
  correct: 1,
  tip: "Any vehicle delaying 3 or more other vehicles in a rural area or on a 2-lane road must turn off safely to let traffic pass. (Handbook pg. 79)"
},
{
  q: "What is the minimum safe clearance distance required when passing a bicyclist in Idaho?",
  options: ["2 feet", "3 feet", "5 feet", "6 feet"],
  correct: 1,
  tip: "A safe margin when passing a bicyclist is at least 3 feet of clearance. (Handbook pg. 98, 101)"
},
{
  q: "What is the proper hand signal for a right turn?",
  options: [
    "Left arm extended straight out the window",
    "Left arm and hand extended downward",
    "Left arm and hand extended upward",
    "Waving the hand backward"
  ],
  correct: 2,
  tip: "Arm extended upward indicates a right turn; straight out means left; downward means stop/slow. (Handbook pg. 72)"
},
{
  q: "Idaho's open container law prohibits:",
  options: [
    "Only the driver from having an open alcoholic beverage container",
    "Both drivers and passengers from possessing an open alcoholic beverage container in the passenger compartment",
    "Carrying unopened bottles of alcohol in a vehicle",
    "Drinking soda or beverages while driving"
  ],
  correct: 1,
  tip: "Idaho law prohibits both drivers and passengers from possessing or drinking from open alcoholic beverage containers. (Handbook pg. 131)"
},
{
  q: "How many hours of supervised driving must a teen under 17 complete during the supervised instruction period?",
  options: [
    "30 hours (5 at night)",
    "40 hours (10 at night)",
    "50 hours (10 of which must be at night)",
    "60 hours (15 at night)"
  ],
  correct: 2,
  tip: "Under the GDL program, drivers must accumulate at least 50 hours of supervised driving, 10 of which must be at night. (Handbook pg. 19)"
},
{
  q: "How many questions can you miss on the 40-question Idaho Class D knowledge test before failing?",
  options: ["Miss up to 4 questions", "Miss up to 6 questions", "Miss up to 8 questions", "Miss up to 10 questions"],
  correct: 1,
  tip: "The Idaho Class D knowledge test has 40 questions; you can miss up to six (6) questions and still pass (need 34/40, or 85%). (Handbook pg. 32)"
},
{
  q: "If you fail an Idaho driver's knowledge test, how long must you wait before you can retake it?",
  options: ["24 hours", "3 days", "7 days", "14 days"],
  correct: 1,
  tip: "If you fail a knowledge test, you must wait three (3) days to retest and repay the test fee. (Handbook pg. 32)"
},
{
  q: "A steady red arrow traffic signal means:",
  options: [
    "Stop, then turn right or left after yielding",
    "No turn is permitted in the direction of the arrow until a signal allows movement",
    "Turn with caution after yielding to pedestrians",
    "The lane will end shortly"
  ],
  correct: 1,
  tip: "A steady red arrow means no turn is permitted in the direction of the arrow until an indication allows movement. (Handbook pg. 55, 69)"
},
{
  q: "In Idaho, children how old or younger must be secured in an approved child car safety seat when riding in a non-commercial vehicle?",
  options: ["4 years or younger", "6 years or younger", "8 years or younger", "10 years or younger"],
  correct: 1,
  tip: "Idaho law requires children 6 years of age or younger to be properly secured in an approved child car safety seat. (Handbook pg. 40)"
},
{
  q: "Idaho's seat belt law requires which of the following?",
  options: [
    "Only the driver must wear a seat belt",
    "Only front-seat occupants must wear a seat belt",
    "All occupants must wear seat belts or shoulder straps when the vehicle is factory-equipped with them",
    "Seat belts are only required on highways"
  ],
  correct: 2,
  tip: "Idaho law requires all occupants to wear safety belts and/or shoulder straps when riding in a vehicle equipped with them by the factory. (Handbook pg. 41)"
},
{
  q: "Under Idaho law, which of the following is illegal while driving?",
  options: [
    "Talking on a hands-free device",
    "Reading, writing, or sending a text message",
    "Listening to the radio",
    "Using a dashboard-mounted GPS"
  ],
  correct: 1,
  tip: "Reading, writing, or sending written communication (text messaging) while driving is illegal in Idaho and considered an infraction. (Handbook pg. 92)"
},
{
  q: "When entering a roundabout in Idaho, drivers must travel in which direction around the circle?",
  options: ["Clockwise", "Counter-clockwise", "Whichever direction is shortest", "Direction posted only at night"],
  correct: 1,
  tip: "Drivers must enter and travel counter-clockwise around a roundabout, merging in whether turning right, left, making a U-turn, or continuing straight. (Handbook pg. 62)"

/* ---------- Inline SVG art for sign / signal / marking questions ---------- */
const ART = (() => {
  const RED = '#c8102e', YEL = '#ffd400', ORG = '#f58220', LIME = '#c6ff00', INK = '#111';
  const A = (label, inner, vb = '0 0 120 120') =>
    `<svg viewBox="${vb}" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  const T = (x, y, s, t, fill = '#fff') =>
    `<text x="${x}" y="${y}" font-size="${s}" font-weight="700" fill="${fill}" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">${t}</text>`;
  const poly = (pts, fill, stroke = 'none', sw = 0, extra = '') =>
    `<polygon points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" ${extra}/>`;
  const ln = (x1, y1, x2, y2, w = 6, c = INK, extra = '') =>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${extra}/>`;
  const path = (d, w = 6, c = INK, extra = '') =>
    `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" ${extra}/>`;
  const rect = (x, y, w, h, fill, stroke = 'none', sw = 0, rx = 0) =>
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
  const circ = (cx, cy, r, fill, stroke = 'none', sw = 0) =>
    `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
  const arrow = (x1, y1, x2, y2, w = 6, c = INK, h = 16) => {
    const a = Math.atan2(y2 - y1, x2 - x1), ca = Math.cos(a), sa = Math.sin(a);
    const bx = x2 - ca * h, by = y2 - sa * h;
    const p = `${x2},${y2} ${bx - sa * h * 0.6},${by + ca * h * 0.6} ${bx + sa * h * 0.6},${by - ca * h * 0.6}`;
    return ln(x1, y1, bx, by, w, c) + poly(p, c);
  };
  const person = (x, y, s = 1, c = INK) =>
    `<g transform="translate(${x} ${y}) scale(${s})" stroke="${c}" stroke-width="5" stroke-linecap="round" fill="${c}">` +
    `<circle cx="0" cy="-22" r="7" stroke="none"/><path d="M0 -12 V10 M0 10 L-9 30 M0 10 L9 30 M-12 -2 H12" fill="none"/></g>`;
  const bike = (x, y, s = 1, c = INK) =>
    `<g transform="translate(${x} ${y}) scale(${s})" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">` +
    `<circle cx="-22" cy="12" r="13"/><circle cx="22" cy="12" r="13"/>` +
    `<path d="M-22 12 L-6 -10 H14 M-6 -10 L2 12 H-22 M2 12 H22 M14 -10 L22 12 M-10 -16 H2"/></g>`;
  const diamond = (fill, inner) =>
    poly('60,3 117,60 60,117 3,60', fill) + poly('60,11 109,60 60,109 11,60', 'none', INK, 3) + inner;
  const pent = (fill, inner) =>
    poly('60,4 114,36 114,114 6,114 6,36', fill) + poly('60,12 107,40 107,107 13,107 13,40', 'none', INK, 3) + inner;
  const rectSign = (w, h, fill, textFill, lines, size) => {
    let s = rect(3, 3, w - 6, h - 6, fill, textFill, 4, 8);
    const gap = size * 1.25, y0 = h / 2 - ((lines.length - 1) * gap) / 2 + size * 0.35;
    lines.forEach((t, i) => { s += T(w / 2, y0 + i * gap, size, t, textFill); });
    return s;
  };

  /* --- regulatory --- */
  const stop = A('Stop sign',
    poly('36,3 84,3 117,36 117,84 84,117 36,117 3,84 3,36', '#fff') +
    poly('40,9 80,9 111,40 111,80 80,111 40,111 9,80 9,40', RED) + T(60, 72, 30, 'STOP'));
  const tri = (s, c) => poly('60,112 6,14 114,14', c, 'none', 0, `transform="translate(60 47) scale(${s}) translate(-60 -47)"`);
  const yieldSign = A('Yield sign', tri(1, '#fff') + tri(0.88, RED) + tri(0.52, '#fff'));
  const doNotEnter = A('Do Not Enter sign', circ(60, 60, 56, RED, '#fff', 3) + rect(20, 50, 80, 20, '#fff'));
  const speed = A('Speed limit 45 sign',
    rect(4, 4, 92, 122, '#fff', INK, 4, 8) + T(50, 32, 17, 'SPEED', INK) + T(50, 52, 17, 'LIMIT', INK) + T(50, 108, 54, '45', INK),
    '0 0 100 130');
  const keepRight = A('Keep right of island sign',
    rect(4, 4, 112, 112, '#fff', INK, 4, 8) + `<path d="M34 84 A18 28 0 0 1 70 84 Z" fill="${INK}"/>` +
    path('M60 112 V96 L86 74 V40', 10) + poly('72,42 100,42 86,16', INK));
  const noRing = circ(60, 60, 40, 'none', RED, 9) + ln(32, 88, 88, 32, 9, RED);
  const noLeft = A('No left turn sign',
    rect(4, 4, 112, 112, '#fff', INK, 4, 8) + path('M80 92 V64 Q80 48 64 48 H48', 10) + poly('32,48 52,34 52,62', INK) + noRing);
  const noUturn = A('No U-turn sign',
    rect(4, 4, 112, 112, '#fff', INK, 4, 8) + path('M76 92 V54 Q76 32 58 32 Q40 32 40 54 V66', 10) + poly('52,64 28,64 40,86', INK) + noRing);

  /* --- work zone --- */
  const shiftArrow = (x) => path(`M${x} 96 C${x} 82 ${x + 12} 80 ${x + 12} 66 C${x + 12} 52 ${x} 52 ${x} 46`, 7) + poly(`${x - 8},46 ${x + 8},46 ${x},28`, INK);
  const laneShift = A('Lane shift work zone sign', diamond(ORG, shiftArrow(46) + shiftArrow(74)));
  const preparedStop = A('Be prepared to stop sign',
    rectSign(160, 100, ORG, INK, ['BE PREPARED', 'TO STOP'], 18), '0 0 160 100');
  const slowMoving = A('Slow moving vehicle emblem',
    poly('60,8 112,104 8,104', RED) +
    poly('60,38 90,94 30,94', ORG));
  const roadClosed = A('Road closed sign', rectSign(160, 100, '#fff', INK, ['ROAD', 'CLOSED'], 26), '0 0 160 100');
  const closedThru = A('Road closed to thru traffic sign',
    rectSign(160, 110, '#fff', INK, ['ROAD CLOSED', 'TO', 'THRU TRAFFIC'], 17), '0 0 160 110');

  /* --- warning --- */
  const t3 = A('Three-way T intersection sign', diamond(YEL, ln(30, 42, 90, 42, 13) + ln(60, 42, 60, 98, 13)));
  const cross = A('Crossroad sign', diamond(YEL, ln(28, 60, 92, 60, 12) + ln(60, 28, 60, 96, 12)));
  const lamp = (cx, cy, c) => circ(cx, cy, 8, c);
  const signalAhead = A('Traffic signal ahead sign',
    diamond(YEL, rect(46, 26, 28, 68, INK, 'none', 0, 6) + lamp(60, 41, '#ef4444') + lamp(60, 60, '#fbbf24') + lamp(60, 79, '#22c55e')));
  const merging = A('Merging traffic sign', diamond(YEL, ln(54, 100, 54, 24, 9) + path('M78 100 V82 C78 62 54 64 54 44', 9)));
  const twoWay = A('Two-way traffic sign', diamond(YEL, arrow(44, 96, 44, 28, 8, INK, 18) + arrow(76, 24, 76, 92, 8, INK, 18)));
  const laneEnds = A('Lane ends merge left sign',
    diamond(YEL, ln(40, 98, 40, 24, 8) + path('M80 98 V72 L50 38', 8) + ln(60, 98, 60, 74, 5, INK, 'stroke-dasharray="8 6"')));
  const school = A('School zone sign', pent(LIME, person(42, 58, 0.95) + person(76, 62, 0.8)));
  const pedestrian = A('Pedestrian crossing sign', diamond(LIME, person(60, 56, 1.2)));
  const lowClear = A('Low clearance sign',
    rectSign(160, 100, YEL, INK, ['LOW', 'CLEARANCE', '12\'-6"'], 18), '0 0 160 100');
  const railroadAdv = A('Railroad crossing advance warning sign',
    circ(60, 60, 56, YEL, INK, 4) + ln(40, 38, 80, 84, 9) + ln(80, 38, 40, 84, 9) + T(22, 68, 22, 'R', INK) + T(98, 68, 22, 'R', INK));
  const slippery = A('Slippery when wet sign',
    diamond(YEL,
      rect(38, 44, 44, 14, INK, 'none', 0, 4) + poly('46,44 52,32 70,32 76,44', INK) +
      circ(48, 62, 6, INK, YEL, 2) + circ(72, 62, 6, INK, YEL, 2) +
      path('M34 82 q8 -8 16 0 t16 0 t16 0', 5)));
  const hill = A('Steep hill sign',
    diamond(YEL, poly('28,40 94,86 28,86', INK) +
      `<g transform="translate(58 61) rotate(35) translate(-58 -61)">${rect(44, 38, 26, 12, INK, 'none', 0, 2)}${circ(50, 52, 4, INK, YEL, 1.5)}${circ(64, 52, 4, INK, YEL, 1.5)}</g>` +
      T(82, 56, 15, '8%', INK)));
  const noPassing = A('No passing zone pennant sign',
    poly('4,8 4,112 116,60', YEL, INK, 4) + T(40, 46, 14, 'NO', INK) + T(46, 64, 14, 'PASSING', INK) + T(40, 82, 14, 'ZONE', INK));
  const shareRoad = A('Share the road sign',
    diamond(YEL, bike(60, 56, 0.85)) +
    rect(10, 126, 100, 40, YEL, INK, 4, 4) + T(60, 144, 14, 'SHARE', INK) + T(60, 160, 14, 'THE ROAD', INK),
    '0 0 120 170');

  /* --- guide signs --- */
  const guide = (fill, lines, label) => A(label, rectSign(160, 100, fill, '#fff', lines, 20), '0 0 160 100');
  const guideGreen = guide('#006b3f', ['BOISE', '25 MILES'], 'Green guide sign');
  const guideBlue = guide('#0057b8', ['GAS', 'FOOD'], 'Blue guide sign');
  const guideBrown = guide('#6b3e1d', ['STATE', 'PARK'], 'Brown guide sign');

  /* --- barricades --- */
  const barricade = (kind) => {
    // clip a convex polygon to x0 <= x <= x1 (Sutherland-Hodgman), so no clipPath is needed
    const clipX = (pts, x0, x1) => {
      const cut = (poly, inside, hit) => {
        const out = [];
        poly.forEach((p, k) => {
          const q = poly[(k + 1) % poly.length];
          if (inside(p)) out.push(p);
          if (inside(p) !== inside(q)) out.push(hit(p, q));
        });
        return out;
      };
      const at = (x) => (p, q) => [x, p[1] + ((q[1] - p[1]) * (x - p[0])) / (q[0] - p[0])];
      let r = cut(pts, (p) => p[0] >= x0, at(x0));
      return r.length ? cut(r, (p) => p[0] <= x1, at(x1)) : r;
    };
    const stripes = (x0, x1, dx) => {
      let s = '';
      for (let x = -80; x < 220; x += 28) {
        const c = clipX([[x, 20], [x + 14, 20], [x + 14 + dx, 56], [x + dx, 56]], x0, x1);
        if (c.length > 2) s += poly(c.map((p) => p.map((n) => n.toFixed(1)).join(',')).join(' '), '#fff');
      }
      return s;
    };
    let body = rect(10, 20, 140, 36, ORG);
    if (kind === 'v') body += stripes(10, 80, 20) + stripes(80, 150, -20);
    else body += stripes(10, 150, kind === 'left' ? -20 : 20);
    return A(kind === 'v' ? 'V-shaped barricade' : `Barricade with stripes angled down to the ${kind}`,
      ln(30, 56, 22, 86, 5, '#ddd') + ln(130, 56, 138, 86, 5, '#ddd') + body + rect(10, 20, 140, 36, 'none', '#fff', 2), '0 0 160 90');
  };

  /* --- traffic signals --- */
  const COLORS = { r: '#ef4444', y: '#fbbf24', g: '#22c55e' };
  const lampAt = (cx, cy, c, val, flash) => {
    let s = circ(cx, cy, 13, val ? COLORS[c] : '#2b2b2b', val ? 'none' : '#444', 2);
    if (val === 'L') s = circ(cx, cy, 13, '#2b2b2b', '#444', 2) + arrow(cx + 7, cy, cx - 8, cy, 4, COLORS[c], 9);
    if (flash) s += circ(cx, cy, 17, 'none', '#fff', 2).replace('/>', ' stroke-dasharray="4 3"/>');
    return s;
  };
  const signal = (r, y, g, caption, flash = '', label = 'Traffic signal') =>
    A(label, rect(38, 4, 44, 104, '#111', '#555', 2, 10) +
      lampAt(60, 28, 'r', r, flash.includes('r')) + lampAt(60, 56, 'y', y, flash.includes('y')) + lampAt(60, 84, 'g', g, flash.includes('g')) +
      T(60, 128, 12, caption, '#cbd5e1'), '-60 0 240 136');
  const hawk = (lights, caption) => {
    const on = (i, c) => (lights[i] ? c : '#2b2b2b');
    const fl = (i) => (lights[i] === 'f' ? circ([40, 80, 60][i], [26, 26, 70][i], 17, 'none', '#fff', 2).replace('/>', ' stroke-dasharray="4 3"/>') : '');
    return A('Pedestrian hybrid beacon',
      rect(18, 4, 84, 90, '#111', '#555', 2, 10) +
      circ(40, 26, 13, on(0, COLORS.r), '#444', 2) + circ(80, 26, 13, on(1, COLORS.r), '#444', 2) + circ(60, 70, 13, on(2, COLORS.y), '#444', 2) +
      fl(0) + fl(1) + fl(2) + T(60, 118, 12, caption, '#cbd5e1'), '-60 0 240 126');
  };

  /* --- pavement markings (top-down road, traffic runs up/down) --- */
  const road = (inner, label) => A(label, rect(0, 0, 200, 120, '#3a3f4a') + inner, '0 0 200 120');
  const Y = '#fbbf24', W = '#f8fafc';
  const vline = (x, c, dash = '', w = 4) => ln(x, 0, x, 120, w, c, dash ? `stroke-dasharray="${dash}"` : '');
  const dashedYellow = road(vline(100, Y, '14 10'), 'Dashed yellow center line');
  const doubleYellow = road(vline(96, Y) + vline(104, Y), 'Double solid yellow lines');
  const solidDashed = road(vline(95, Y) + vline(105, Y, '14 10') + T(55, 66, 28, 'A', '#cbd5e1') + T(150, 66, 28, 'B', '#cbd5e1'), 'Solid and dashed yellow lines');
  const sharedTurn = road(vline(70, Y) + vline(78, Y, '14 10') + vline(122, Y, '14 10') + vline(130, Y), 'Shared center turn lane markings');
  const edgeLines = road(vline(16, W) + vline(184, W) + vline(100, Y, '14 10'), 'Solid white edge lines');
  const whiteSolid = road(vline(16, W) + vline(184, W) + vline(100, W), 'Solid white lane line');
  const whiteDashed = road(vline(16, W) + vline(184, W) + vline(100, W, '14 10'), 'Dashed white lane line');
  const whiteDouble = road(vline(16, W) + vline(184, W) + vline(96, W) + vline(104, W), 'Double solid white lane lines');
  const bikeLane = road(vline(110, W) + vline(190, W) + bike(150, 62, 0.9, W), 'Bike lane with bicycle insignia');
  const bikeDashed = road(vline(110, W) + vline(150, W, '12 10') + vline(190, W), 'Dashed bike lane line');
  const bikeGreen = road(vline(110, W) + vline(190, W) + rect(112, 24, 76, 72, '#16a34a') + bike(150, 62, 0.9, W), 'Green pavement in bike lane');
  const rrMarking = road(ln(60, 18, 140, 70, 7, W) + ln(140, 18, 60, 70, 7, W) + T(46, 108, 30, 'R', W) + T(154, 108, 30, 'R', W), 'Railroad crossing pavement marking');
  const crossbuck = (() => {
    // words: [[offset along the bar, text], ...]; RAILROAD is split so CROSSING passes over the gap
    const bar = (deg, words) => {
      const a = (deg * Math.PI) / 180, c = Math.cos(a), s = Math.sin(a);
      const pt = (u, v) => `${(80 + u * c - v * s).toFixed(1)},${(55 + u * s + v * c).toFixed(1)}`;
      return poly([pt(-72, -15), pt(72, -15), pt(72, 15), pt(-72, 15)].join(' '), '#fff', INK, 3) +
        words.map(([u, w]) => `<text x="0" y="6" font-size="15" font-weight="700" fill="${INK}" text-anchor="middle" ` +
          `font-family="Arial,Helvetica,sans-serif" transform="translate(${(80 + u * c).toFixed(1)} ${(55 + u * s).toFixed(1)}) rotate(${deg})">${w}</text>`).join('');
    };
    return A('Railroad crossbuck sign', bar(32, [[-47, 'RAIL'], [47, 'ROAD']]) + bar(-32, [[0, 'CROSSING']]), '0 0 160 110');
  })();

  /* --- roundabout --- */
  const arcArrow = (cx, cy, r, a0, a1, w, c, h) => {
    const pt = (a) => [cx + r * Math.cos((a * Math.PI) / 180), cy - r * Math.sin((a * Math.PI) / 180)];
    const [x0, y0] = pt(a0), [x1, y1] = pt(a1 - 4), [xt, yt] = pt(a1);
    return path(`M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 0 ${x1.toFixed(1)} ${y1.toFixed(1)}`, w, c) +
      arrow(x1, y1, xt, yt, w, c, h);
  };
  const roundabout = A('Roundabout diagram: traffic circulates counter-clockwise',
    rect(0, 0, 200, 200, '#2f6f3e') + rect(82, 0, 36, 200, '#3a3f4a') + rect(0, 82, 200, 36, '#3a3f4a') +
    circ(100, 100, 56, '#3a3f4a') + circ(100, 100, 26, '#2f6f3e', '#cbd5e1', 2) +
    [20, 110, 200, 290].map((a) => arcArrow(100, 100, 41, a, a + 62, 4, '#fff', 12)).join(''),
    '0 0 200 200');
  const roundSign = A('Roundabout warning sign',
    diamond(YEL, [90, 210, 330].map((a) => arcArrow(60, 60, 22, a, a + 85, 6, INK, 14)).join('')));

  return {
    stop, yield: yieldSign, doNotEnter, speed, keepRight, noLeft, noUturn,
    laneShift, preparedStop, slowMoving, roadClosed, closedThru,
    t3, cross, signalAhead, merging, twoWay, laneEnds, school, pedestrian, lowClear,
    railroadAdv, slippery, hill, noPassing, shareRoad, guideGreen, guideBlue, guideBrown,
    barV: barricade('v'), barLeft: barricade('left'), barRight: barricade('right'),
    sigRed: signal(1, 0, 0, 'STEADY RED'),
    sigFlashRed: signal(1, 0, 0, 'FLASHING RED', 'r'),
    sigRedArrow: signal('L', 0, 0, 'STEADY RED ARROW'),
    sigYellow: signal(0, 1, 0, 'STEADY YELLOW'),
    sigFlashYellow: signal(0, 1, 0, 'FLASHING YELLOW', 'y'),
    sigYellowArrow: signal(0, 'L', 0, 'SOLID YELLOW ARROW'),
    sigFlashYellowArrow: signal(0, 'L', 0, 'FLASHING YELLOW ARROW', 'y'),
    sigGreen: signal(0, 0, 1, 'GREEN'),
    hawkDark: hawk([0, 0, 0], 'DARK'),
    hawkFlashYellow: hawk([0, 0, 'f'], 'FLASHING YELLOW'),
    hawkSolidYellow: hawk([0, 0, 1], 'SOLID YELLOW'),
    hawkRed: hawk([1, 1, 0], 'TWO SOLID RED'),
    hawkFlashRed: hawk(['f', 'f', 0], 'ALTERNATING FLASHING RED'),
    dashedYellow, doubleYellow, solidDashed, sharedTurn, edgeLines, whiteSolid, whiteDashed, whiteDouble,
    bikeLane, bikeDashed, bikeGreen, rrMarking, crossbuck, roundabout, roundSign
  };

const MODES = {
  full:  { size: 20, title: 'Exam Complete', pool: (q) => true },
  signs: { size: 40, title: 'Signs & Signals Complete', pool: (q) => q.cat === 'signs' || !!q.img }
};
let currentMode = 'full';
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let hasAnswered = false;

function shuffle(array) {
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function showMenu() {
  ['quizCard', 'progressContainer', 'resultsScreen'].forEach(id => { document.getElementById(id).style.display = 'none'; });
  document.getElementById('menuScreen').style.display = 'block';
}

function startQuiz(mode) {
  currentMode = MODES[mode] ? mode : 'full';
  const cfg = MODES[currentMode];
  const shuffledBank = shuffle(QUESTION_BANK.filter(cfg.pool));
  const selected = shuffledBank.slice(0, Math.min(cfg.size, shuffledBank.length));
  currentQuestions = selected.map(item => {
    const optionsWithOrig = item.options.map((opt, idx) => ({ text: opt, isCorrect: idx === item.correct }));
    const shuffledOptions = shuffle(optionsWithOrig);
    const newCorrect = shuffledOptions.findIndex(o => o.isCorrect);
    return {
      q: item.q,
      options: shuffledOptions.map(o => o.text),
      correct: newCorrect,
      tip: item.tip,
      img: item.img
    };
  });
  currentIndex = 0;
  score = 0;
  hasAnswered = false;
  document.getElementById('menuScreen').style.display = 'none';
  document.getElementById('quizCard').style.display = 'block';
  document.getElementById('progressContainer').style.display = 'block';
  document.getElementById('resultsScreen').style.display = 'none';
  renderQuestion();
}

function renderQuestion() {
  hasAnswered = false;
  const qData = currentQuestions[currentIndex];
  document.getElementById('questionNum').innerText = `${currentMode === 'signs' ? 'Sign' : 'Question'} ${currentIndex + 1} of ${currentQuestions.length}`;
  document.getElementById('currentScore').innerText = `Score: ${score}/${currentIndex}`;
  document.getElementById('questionText').innerText = qData.q;
  const imgEl = document.getElementById('questionImg');
  imgEl.innerHTML = qData.img ? ART[qData.img] : '';
  imgEl.style.display = qData.img ? 'flex' : 'none';
  const pct = (currentIndex / currentQuestions.length) * 100;
  document.getElementById('progressBar').style.width = `${pct}%`;
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  const labels = ['A', 'B', 'C', 'D'];
  qData.options.forEach((optText, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="label">${labels[idx]}</span><span>${optText}</span>`;
    btn.onclick = () => selectAnswer(idx);
    container.appendChild(btn);
  });
  const feedback = document.getElementById('feedback');
  feedback.style.display = 'none';
  feedback.className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';
}

function selectAnswer(selectedIdx) {
  if (hasAnswered) return;
  hasAnswered = true;
  const qData = currentQuestions[currentIndex];
  const buttons = document.querySelectorAll('.option-btn');
  const feedback = document.getElementById('feedback');
  const feedbackTitle = document.getElementById('feedbackTitle');
  const feedbackText = document.getElementById('feedbackText');
  buttons.forEach((btn, idx) => {
    btn.onclick = null;
    if (idx === qData.correct) {
      btn.classList.add('correct');
    } else if (idx === selectedIdx) {
      btn.classList.add('wrong');
    }
  });
  if (selectedIdx === qData.correct) {
    score++;
    feedback.className = 'feedback correct';
    feedbackTitle.innerText = 'Correct!';
  } else {
    feedback.className = 'feedback wrong';
    feedbackTitle.innerText = 'Incorrect';
  }
  feedbackText.innerText = qData.tip;
  feedback.style.display = 'block';
  document.getElementById('currentScore').innerText = `Score: ${score}/${currentIndex + 1}`;
  document.getElementById('nextBtn').style.display = 'inline-block';
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < currentQuestions.length) {
    renderQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('progressContainer').style.display = 'none';
  const resultsScreen = document.getElementById('resultsScreen');
  resultsScreen.style.display = 'block';
  const pct = Math.round((score / currentQuestions.length) * 100);
  document.getElementById('scorePercent').innerText = `${pct}%`;
  document.getElementById('scoreFraction').innerText = `${score} / ${currentQuestions.length}`;
  document.querySelector('#resultsScreen h2').innerText = MODES[currentMode].title;
  const badge = document.getElementById('statusBadge');
  const summary = document.getElementById('summaryMessage');
  const rating = document.getElementById('ratingText');
  const passed = pct >= 85; // Idaho allows max 6 misses out of 40 (85%)
  badge.className = 'pass-tag ' + (passed ? 'pass' : 'fail');
  if (currentMode === 'signs') {
    const tiers = [
      [95, 'Sign Master', 'Outstanding. You can read the road like a pro.'],
      [85, 'Road Ready', 'Solid. You are at or above the 85% passing mark.'],
      [70, 'Getting There', 'Close. Review the signs you missed and try again.'],
      [0, 'Back to the Handbook', 'Study the signs section of the handbook, then try again.']
    ];
    const [, name, msg] = tiers.find(t => pct >= t[0]);
    rating.innerText = name;
    badge.innerText = passed ? 'PASSING RANGE (85%+)' : 'BELOW PASSING (< 85%)';
    summary.innerText = msg;
  } else {
    rating.innerText = '';
    badge.innerText = passed ? 'PASSING SCORE (85%+)' : 'NEEDS REVIEW (< 85%)';
    summary.innerText = passed
      ? 'Great job! You meet or exceed the state requirement for the knowledge test.'
      : 'Idaho requires 85% to pass (no more than 6 errors on 40 questions). Review the missed items and try again!';
  }
}
